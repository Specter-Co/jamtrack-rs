[package]
name = "jamtrack-rs"
version = "0.2.2"
edition = "2021"
authors = ["kadu-v (Kazuki Ikemori)"]
description = "ByteTrack implementation in Rust"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bench]]
name = "bytetrack_benchmark"
harness = false

[[bin]]
name = "visualizer"
path = "src/bin/visualizer/main.rs"
required-features = ["visualizer"]

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[features]
deterministic = []
visualizer = ["dep:eframe", "dep:egui", "dep:ffmpeg-next", "dep:crossbeam-channel", "dep:image", "dep:rfd"]

[dependencies]
thiserror = "1.0.66"
nalgebra = "0.33.2"
num = "0.4.3"
serde = { version = "1.0.183", features = ["derive"] }
serde_json = "1.0.104"
glob = "0.3"

# Visualizer dependencies (optional)
eframe = { version = "0.30", optional = true }
egui = { version = "0.30", optional = true }
ffmpeg-next = { version = "7.0", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
image = { version = "0.25", optional = true }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
nearly_eq = "0.2.4"
quickcheck = "1.0.3"
rand = "0.8.5"
criterion = "0.5.1"
